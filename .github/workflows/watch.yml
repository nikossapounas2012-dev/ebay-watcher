name: eBay price watch

# Started every 2 hours at :17 by cron-job.org (GitHub's own schedule skipped most runs).
# ~260 card + ~50 box + ~20 Sorcery searches x 12 runs = ~4,000 eBay searches a day (eBay allows 5,000),
# so don't add a GitHub schedule as well - late duplicate runs would go over the limit.
on:
  workflow_dispatch:          # cron-job.org calls this; also the "Run workflow" button
    inputs:
      force:
        description: "Check even if the last check was less than 100 minutes ago"
        type: boolean
        default: false

permissions:
  contents: write            # needed to save prices + history to the "data" branch

concurrency:
  group: ebay-watch          # never run two checks at the same time
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # saved prices + history live on a separate "data" branch,
      # so these automatic commits never clash with code changes on main
      - name: Get saved data
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" data > /dev/null; then
            git clone --quiet --depth 1 --branch data "$REPO_URL" data
          else
            mkdir data
            git -C data init --quiet -b data
            git -C data remote add origin "$REPO_URL"
          fi

      - name: Check prices
        run: python ebay_watch.py --once ${{ inputs.force && '--force' || '' }}
        env:
          DATA_DIR: data
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # save even if Telegram failed, so prices are not lost
      - name: Save data
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit --quiet -m "Prices $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push --quiet origin data
          fi

name: eBay price watch

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC). GitHub often starts a few minutes late.
  workflow_dispatch:          # adds a "Run workflow" button to run it by hand

concurrency:
  group: ebay-watch          # never run two checks at the same time
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # bring back the last saved prices, so drops can be detected between runs
      - name: Restore saved prices
        uses: actions/cache/restore@v4
        with:
          path: ebay_prices.json
          key: ebay-prices-${{ github.run_id }}
          restore-keys: ebay-prices-

      - name: Check prices
        run: python ebay_watch.py --once
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # save the new prices for the next run
      - name: Save prices
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ebay_prices.json
          key: ebay-prices-${{ github.run_id }}

name: Price video

# Makes a short vertical price video (YouTube Shorts) from the saved prices and sends it to Telegram
# for a check - you upload it yourself. No eBay searches, so it doesn't touch the daily eBay limit.
# Weekly "biggest movers" on Sundays; or press "Run workflow" and give one item number (e.g. P165).
# GitHub may start the Sunday run late or skip it; a cron-job.org job (like the price check's) is more reliable.

on:
  schedule:
    - cron: "7 10 * * 0"      # Sundays 10:07 UTC
  workflow_dispatch:
    inputs:
      item:
        description: "One item number for a single-item video (e.g. P165, S20, B4) - empty = weekly top movers"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video tools
        run: pip install matplotlib==3.9.2 imageio-ffmpeg==0.5.1   # imageio-ffmpeg brings its own ffmpeg

      - name: Get saved prices
        run: git clone --quiet --depth 1 --branch data "https://github.com/${{ github.repository }}.git" data

      - name: Make video
        run: python make_video.py ${{ inputs.item && format('--item {0}', inputs.item) || '' }}
        env:
          DATA_DIR: data
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # a copy on GitHub too (Actions run page -> Artifacts), kept for 14 days
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-video
          path: out/
          retention-days: 14
          if-no-files-found: ignore

name: Telegram replies

# Answers "12" / "B4" / "S20" / "own S12 £40" replies in Telegram with the eBay links, between the price checks.
# Started every 5 minutes by cron-job.org (GitHub's own schedule skipped most runs).
# Uses ~8,600 minutes a month: free only if the repository is PUBLIC.
# On a private repository, stop the cron-job.org job - replies are then answered at each price check instead.

on:
  workflow_dispatch:          # cron-job.org calls this

permissions:
  contents: write            # saves collection.txt when you send 'own' or 'sold'

concurrency:
  group: ebay-watch          # shared with the price check, so a reply is never answered twice
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Get saved prices
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" data > /dev/null; then
            git clone --quiet --depth 1 --branch data "$REPO_URL" data
          else
            mkdir data
          fi

      - name: Answer replies
        run: python3 ebay_watch.py --replies
        env:
          DATA_DIR: data
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # 'own' / 'sold' replies in Telegram change collection.txt - save it to main
      - name: Save collection
        if: always()
        run: |
          if git diff --quiet -- collection.txt; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection.txt
          git commit --quiet -m "Collection: changed from Telegram"
          git pull --quiet --rebase origin main
          git push --quiet origin HEAD:main
